[package]
name = "fbr-ram-downloader"
version = "0.1.2"
edition = "2021"
description = "Live HBM2 memory clock unlock for NVIDIA Tesla V100 wrapped in a 4-color Game Boy cracktro"
license = "Unlicense"
repository = "https://github.com/FBR-ROM/FBR-RAM-Downloader"
readme = "README.md"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
rodio = "0.21"
libc = "0.2"
v100-unlock = { path = "v100-unlock" }

[profile.release]
opt-level = 3
lto = true

[workspace]
members = ["v100-unlock"]
