[package]
name = "fbr-ram-downloader"
version = "0.1.0"
edition = "2021"
description = "FBR RAM downloader TUI with a 3D spinning logo"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
rodio = "0.21"
libc = "0.2"
v100-unlock = { path = "v100-unlock" }

[profile.release]
opt-level = 3
lto = true

[workspace]
members = ["v100-unlock"]
